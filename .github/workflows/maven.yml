name: Build EconomyCore JARs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Set Paper and Folia compiler level
        shell: bash
        run: |
          sed -i 's/<source>21<\/source>/<source>25<\/source>/g' PaperCore/pom.xml Folia/pom.xml
          sed -i 's/<target>21<\/target>/<target>25<\/target>/g' PaperCore/pom.xml Folia/pom.xml
          sed -i 's/<release>21<\/release>/<release>25<\/release>/g' PaperCore/pom.xml Folia/pom.xml
          grep -nE '<(source|target|release)>25</(source|target|release)>' PaperCore/pom.xml Folia/pom.xml

      - name: Build JARs with Maven
        id: maven
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean package --file pom.xml 2>&1 | tee maven-build.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven failure log
        if: steps.maven.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: Maven-failure-${{ github.sha }}
          path: maven-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Maven build fails
        if: steps.maven.outputs.status != '0'
        run: exit 1

      - name: Upload built JARs
        if: steps.maven.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: EconomyCore-${{ github.sha }}
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
