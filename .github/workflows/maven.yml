name: Build EconomyCore JARs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build JARs with Maven
        id: maven
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean package --file pom.xml 2>&1 | tee maven-build.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven failure log
        if: steps.maven.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: Maven-failure-${{ github.sha }}
          path: maven-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Maven build fails
        if: steps.maven.outputs.status != '0'
        run: exit 1

      - name: Upload built JARs
        if: steps.maven.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: EconomyCore-${{ github.sha }}
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30

      - name: Update dependency graph
        if: steps.maven.outputs.status == '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
